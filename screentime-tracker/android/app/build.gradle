plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.apptimetracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.apptimetracker"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed signing key so every CI build can be installed over the previous one.
    // This is the standard, public Android debug key: fine for personal sideloading only.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
